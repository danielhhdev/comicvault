name: Claude

# Requiere: la GitHub App de Claude instalada en el repo (/install-github-app desde Claude Code)
# y el secreto ANTHROPIC_API_KEY.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # 1) Revisión automática de cada PR, siguiendo CLAUDE.md y las rules del repo
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revisa este pull request siguiendo CLAUDE.md y las reglas de .claude/rules/.
            Usa el subagente code-reviewer. Comenta de forma concisa: bloqueantes primero,
            después importantes y sugerencias. No modifiques archivos.
          claude_args: "--max-turns 10"

  # 2) Menciones "@claude" en issues y PRs
  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 15"
